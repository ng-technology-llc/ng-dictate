name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify NG updater configuration
        shell: bash
        run: |
          legacy_release="github.com/cjpais/Handy""/releases"
          legacy_signing="CJ""-Signing"
          legacy_bundle="com[.]pais[.]handy"
          if rg -n "${legacy_release}|${legacy_signing}|${legacy_bundle}" src-tauri/tauri.conf.json; then
            echo "Refusing to release with upstream Handy updater/signing configuration."
            exit 1
          fi

      - name: Verify production signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_ID_PASSWORD \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            KEYCHAIN_PASSWORD \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production signing secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin --bundles app"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin --bundles app"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "ng-dictate"
      asset-name-pattern: "[version]_[platform]_[arch][ext]"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  verify-release-artifacts:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - create-release
      - publish-tauri
    steps:
      - name: Verify latest.json exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          test -n "${RELEASE_ID}"
          assets="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[].name')"
          printf 'Release assets:\n%s\n' "$assets"

          printf '%s\n' "$assets" | awk '$0 == "latest.json" { found = 1 } END { exit found ? 0 : 1 }'

          dmg_count="$(printf '%s\n' "$assets" | awk '/\.dmg$/ { count++ } END { print count + 0 }')"
          updater_count="$(printf '%s\n' "$assets" | awk '/\.app\.tar\.gz$/ { count++ } END { print count + 0 }')"
          signature_count="$(printf '%s\n' "$assets" | awk '/\.app\.tar\.gz\.sig$/ { count++ } END { print count + 0 }')"

          printf 'DMG count: %s\nUpdater count: %s\nUpdater signature count: %s\n' \
            "$dmg_count" \
            "$updater_count" \
            "$signature_count"

          test "$dmg_count" -ge 2
          test "$updater_count" -ge 2
          test "$signature_count" -ge 2
